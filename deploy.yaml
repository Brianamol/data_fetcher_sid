apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-fetcher-sid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-fetcher-sid
  template:
    metadata:
      labels:
        app: data-fetcher-sid
    spec:
      containers:
        - name: data-fetcher
          image: inteligen/data_fetcher_sid:latest
          envFrom:
            - secretRef:
                name: data-fetcher-env
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Secret
metadata:
  name: data-fetcher-env
type: Opaque
stringData:
  DB_HOST: "mysql-service"
  DB_USER: "root"
  DB_PASS: "Brian@2024"
  DB_NAME: "par_data"
  RABBITMQ_URL: "amqp://rabbitmq"
